[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Linux only for now: x86_64 + aarch64, glibc and musl. The musl builds are
# static, so they run on any distro regardless of glibc version. macOS targets
# are added once code signing/notarization is sorted (see docs/install.md).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Extra files to ship inside every release archive. The desktop launcher is
# handy for the AUR `calstack-bin` package (the source package already has it).
include = ["packaging/calstack.desktop"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
